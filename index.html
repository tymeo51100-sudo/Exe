<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil - Roblox</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Builder Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #111216;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRE SUPÉRIEURE (TOPBAR) */
    .topbar {
      height: 60px;
      background-color: #191b21;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #23252d;
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
    }

    .search-bar {
      background-color: #23252d;
      border: 1px solid #393b45;
      border-radius: 8px;
      padding: 8px 14px;
      width: 300px;
      color: #fff;
      outline: none;
    }

    .search-bar::placeholder {
      color: #898a8d;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 14px;
      font-weight: 600;
    }

    .robux-balance {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #23252d;
      padding: 6px 12px;
      border-radius: 20px;
    }

    /* CONTENEUR PRINCIPAL */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* BARRE LATÉRALE (SIDEBAR) */
    .sidebar {
      width: 240px;
      background-color: #111216;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-right: 1px solid #191b21;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 15px;
      color: #b8b8b8;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      background-color: #191b21;
      color: #fff;
    }

    /* ZONE DE CONTENU (FEED) */
    .content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .user-banner {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .avatar-circle {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #393b45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
    }

    .user-info h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .user-info p {
      color: #898a8d;
      font-size: 14px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    /* GRILLE DE JEUX */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .game-card {
      background-color: #191b21;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      background-color: #23252d;
    }

    .game-thumbnail {
      width: 100%;
      aspect-ratio: 1;
      background-color: #2b2d37;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555763;
      font-size: 14px;
    }

    .game-details {
      padding: 10px;
    }

    .game-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .game-stats {
      font-size: 12px;
      color: #898a8d;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">Roblox</div>
      <input type="text" class="search-bar" placeholder="Rechercher">
    </div>
    <div class="topbar-right">
      <div class="robux-balance">
        <span>R$</span>
        <span>1,250</span>
      </div>
      <div class="avatar-circle" style="width: 32px; height: 32px; font-size: 12px;">T</div>
    </div>
  </header>

  <div class="main-container">
    <nav class="sidebar">
      <a href="#" class="nav-item active">Accueil</a>
      <a href="#" class="nav-item">Profil</a>
      <a href="#" class="nav-item">Boutique d'avatars</a>
      <a href="#" class="nav-item">Inventaire</a>
      <a href="#" class="nav-item">Groupes</a>
      <a href="#" class="nav-item">Créer</a>
    </nav>

    <main class="content">
      <section class="user-banner">
        <div class="avatar-circle">T</div>
        <div class="user-info">
          <h1>Accueil</h1>
          <p>Ravi de te revoir, Titi !</p>
        </div>
      </section>

      <h2 class="section-title">Recommandés pour toi</h2>
      <div class="games-grid">
        <div class="game-card">
          <div class="game-thumbnail">Image du jeu</div>
          <div class="game-details">
            <div class="game-title">Brookhaven RP</div>
            <div class="game-stats">
              <span>👍 89%</span>
              <span>👤 450K</span>
            </div>
          </div>
        </div>

        <div class="game-card">
          <div class="game-thumbnail">Image du jeu</div>
          <div class="game-details">
            <div class="game-title">Blox Fruits</div>
            <div class="game-stats">
              <span>👍 94%</span>
              <span>👤 320K</span>
            </div>
          </div>
        </div>

        <div class="game-card">
          <div class="game-thumbnail">Image du jeu</div>
          <div class="game-details">
            <div class="game-title">Adopt Me!</div>
            <div class="game-stats">
              <span>👍 85%</span>
              <span>👤 110K</span>
            </div>
          </div>
        </div>

        <div class="game-card">
          <div class="game-thumbnail">Image du jeu</div>
          <div class="game-details">
            <div class="game-title">Tower of Hell</div>
            <div class="game-stats">
              <span>👍 78%</span>
              <span>👤 25K</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
